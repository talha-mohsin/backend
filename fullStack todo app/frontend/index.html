<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FullStack | To do App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .container {
        width: 80%;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .inputBar {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      .inputBar input,
      .inputBar select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 100%;
      }

      .inputBar button {
        padding: 10px 18px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }

      .inputBar button:hover {
        background: #43a047;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      table thead {
        background: #2c3e50;
        color: white;
      }

      table th,
      table td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #eee;
      }

      table tbody tr:hover {
        background: #f5f5f5;
      }

      table button {
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      table button:first-child {
        background: #3498db;
        color: white;
      }

      table button:last-child {
        background: #e74c3c;
        color: white;
      }

      table button:hover {
        opacity: 0.9;
      }

      /* Edit Modal */

      .updatedForm {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 350px;
        flex-direction: column;
        gap: 10px;
      }

      .updatedForm button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      #updateBtn {
        background: #27ae60;
        color: white;
      }

      #closeBtn {
        background: #e74c3c;
        color: white;
      }

      /* Tablet */
      @media (max-width: 1024px) {
        .container {
          width: 95%;
        }

        .inputBar {
          flex-wrap: wrap;
        }

        .inputBar input,
        .inputBar select {
          flex: 1 1 45%;
        }

        .inputBar button {
          flex: 1 1 100%;
        }
      }

      /* Mobile */
      @media (max-width: 700px) {
        body {
          padding: 20px;
        }

        .inputBar {
          flex-direction: column;
        }

        .inputBar input,
        .inputBar select,
        .inputBar button {
          width: 100%;
        }

        table {
          font-size: 14px;
        }

        table th,
        table td {
          padding: 8px;
        }

        .updatedForm {
          width: 90%;
        }

        @media (max-width: 580px) {
          .container {
            width: 100%;
            overflow: hidden;
          }

          .tableWrapper {
            width: 100%;
            overflow-x: auto;
          }

          table {
            min-width: 600px;
          }

          table th,
          table td {
            padding: 8px;
            font-size: 13px;
          }

          .inputBar {
            flex-direction: column;
          }

          .inputBar input,
          .inputBar select,
          .inputBar button {
            width: 100%;
          }

          .updatedForm {
            width: 90%;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>
      <div class="inputBar">
        <input id="task" type="text" placeholder="Task" />
        <input id="dueDate" type="date" placeholder="Due Date" />
        <select name="status" id="status">
          <option value="">Status</option>
          <option value="In-Progress">In-Progress</option>
          <option value="Pending">Pending</option>
          <option value="Done">Done</option>
        </select>

        <select name="priority" id="priority">
          <option value="">Priority</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <button id="addBtn">Add</button>
      </div>
      <div class="tableWrapper">
        <table>
          <thead>
            <tr>
              <th>Task</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Edit</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="allTasks"></tbody>
        </table>
      </div>

      <!-- modal for edit the task -->
      <div class="inputBar updatedForm">
        <input id="updatedTask" type="text" placeholder="Task" />
        <input id="updateddueDate" type="date" placeholder="Due Date" />
        <select name="status" id="updatedStatus">
          <option value="">Status</option>
          <option value="In-Progress">In-Progress</option>
          <option value="Pending">Pending</option>
          <option value="Done">Done</option>
        </select>

        <select name="priority" id="updatedPriority">
          <option value="">Priority</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <button id="updateBtn">Update</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
