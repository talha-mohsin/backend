<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FullStack Authentication</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f9;
      }

      form {
        background: #ffffff;
        padding: 30px;
        width: 380px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      form h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
      }

      form input,
      form select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      form input:focus,
      form select:focus {
        outline: none;
        border-color: #4caf50;
      }

      form button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
      }

      form button:hover {
        background: #43a047;
      }

      form p {
        text-align: center;
        font-size: 14px;
      }

      form a {
        color: #4caf50;
        text-decoration: none;
        font-weight: 500;
      }

      form a:hover {
        text-decoration: underline;
      }

      /* Tablet */
      @media (max-width: 768px) {
        form {
          width: 90%;
          padding: 25px;
        }
      }

      /* Mobile */
      @media (max-width: 480px) {
        body {
          padding: 20px;
        }

        form {
          width: 100%;
          padding: 20px;
        }

        form h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <form action="">
      <h1>Login Your Account</h1>
      <input id="email" type="email" placeholder="email" />
      <input id="password" type="password" placeholder="password" />
      <button id="loginBtn" type="submit">Login</button>
      <p>
        You haven't account?
        <a href="index.html">Signup</a>
      </p>
    </form>

    <script src="login.js"></script>
  </body>
</html>
